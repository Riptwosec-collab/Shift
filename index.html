<script>// data.js
const DAYS_IN_MONTH = 31;
const STAFF = Object.freeze([
{name:"นาย นลิทัศน์ นากรณ์",s:"OOOOODDDDOODDDDOOOODDOOOONNNNNN"},
{name:"นายกิตติ ยอดนนท์",s:"DDOODDDOOOODDOODDOOOONNNNNOODDO"},
{name:"นายครีมคนัย ศิริมาศย์",s:"OODDDDOODDDOODDOODDOODDDDDOOOOO"},
{name:"นายสถิตย์ พันธ์แดง",s:"OODDDOODDDDDOOODDDDOOOOOOODDDDO"},
{name:"นายวัชระ ภูเกิด",s:"NNNNOOOONNNOOOOONNNNNOOOODDDOOD"},
{name:"นายพัชร สันต์พิสิ",s:"OOOONNNNOOONNNNOOODDDDOOODDOODD"},
{name:"นายเสถียร มาสา",s:"DDOOONNNNOOONNNNOOODDDOOODDDOON"},
{name:"นายอิศเรศ เวียงอินทร์",s:"NNNNNOOOONNNOOONNNNOOOODDOODDOO"},
{name:"นายกฤติศ โพธิ์ไทรย์",s:"DDOOOODDDOODODDOOOONNNNNNOOODDO"},
{name:"นายกิตติศักดิ์ วัชรรังสิมันต์",s:"DDOODDDDOOOOODDOOODDDDDOOONNNNO"}
]);
function statusAt(personIndex, day){ return STAFF[personIndex]?.s?.[day-1] ?? null; }
function formatStatus(code){ return code==='O'?'OFF':code; }
function dateMeta(day){ const d=new Date(2026,9,day); return {day,date:d,weekday:d.toLocaleDateString('th-TH',{weekday:'long'}),thai:d.toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}; }

// cache.js

function currentWorkStreak(staff,personIndex,day){let n=0;for(let d=day;d>=1;d--){if(staff[personIndex].s[d-1]==='O')break;n++;}return n}
function currentNightStreak(staff,personIndex,day){let n=0;for(let d=day;d>=1;d--){if(staff[personIndex].s[d-1]!=='N')break;n++;}return n}
const longest=(s,pred)=>{let best=0,cur=0;for(const c of s){if(pred(c)){cur++;best=Math.max(best,cur)}else cur=0}return best};
function createScheduleCache(staff=STAFF){const dayStats=Array(32);for(let d=1;d<=31;d++){let D=0,N=0,OFF=0;for(const p of staff){const c=p.s[d-1];if(c==='D')D++;else if(c==='N')N++;else OFF++;}const working=D+N;dayStats[d]={day:d,D,N,OFF,working,coverage:Math.round(working/staff.length*100)}}
const personStats=staff.map((p,i)=>{const D=[...p.s].filter(x=>x==='D').length,N=[...p.s].filter(x=>x==='N').length,OFF=31-D-N,working=D+N;return {i,name:p.name,D,N,OFF,working,nightPct:working?Math.round(N/working*100):0,longestWorkStreak:longest(p.s,x=>x!=='O'),longestNightStreak:longest(p.s,x=>x==='N')}});
const pairStats=[];let maxRaw=0;for(let a=0;a<staff.length;a++)for(let b=a+1;b<staff.length;b++){let sameD=0,sameN=0,handoff=0;for(let d=0;d<31;d++){const A=staff[a].s[d],B=staff[b].s[d];if(A==='D'&&B==='D')sameD++;if(A==='N'&&B==='N')sameN++;if(d<30){const A2=staff[a].s[d+1],B2=staff[b].s[d+1];if((A!=='O'&&A2==='O'&&B==='O'&&B2!=='O')||(B!=='O'&&B2==='O'&&A==='O'&&A2!=='O'))handoff++;}}const sameShift=sameD+sameN,raw=sameShift*2+handoff;maxRaw=Math.max(maxRaw,raw);pairStats.push({a,b,sameD,sameN,sameShift,handoff,raw});}
for(const p of pairStats)p.strength=maxRaw?Math.round(p.raw/maxRaw*100):0;const avgWork=personStats.reduce((a,b)=>a+b.working,0)/staff.length,avgN=personStats.reduce((a,b)=>a+b.N,0)/staff.length;const sorted=[...dayStats.slice(1)].sort((a,b)=>b.working-a.working);const teamStats={avgWork,avgN,busiest:sorted[0],least:[...sorted].reverse()[0],monthD:dayStats.slice(1).reduce((a,x)=>a+x.D,0),monthN:dayStats.slice(1).reduce((a,x)=>a+x.N,0),monthOFF:dayStats.slice(1).reduce((a,x)=>a+x.OFF,0)};return {dayStats,personStats,pairStats,teamStats}}

// core.js
function createAppState(){const listeners=new Map();const s={activeView:'overview',selectedDay:1,selectedPerson:0,visualMode:'BALANCED',on(e,f){const a=listeners.get(e)||[];a.push(f);listeners.set(e,a);return()=>listeners.set(e,a.filter(x=>x!==f))},emit(e,v){for(const f of listeners.get(e)||[])f(v)},setSelectedDay(d){d=Math.max(1,Math.min(31,Number(d)||1));if(d!==s.selectedDay){s.selectedDay=d;s.emit('day',d)}},setSelectedPerson(i){i=Math.max(0,Math.min(9,Number(i)||0));if(i!==s.selectedPerson){s.selectedPerson=i;s.emit('person',i)}}};return s}
function createViewRegistry(){const m=new Map();return {register(name,mount,update=()=>{}){m.set(name,{mount,update,mounted:false})},show(name){const v=m.get(name);if(!v)return false;if(!v.mounted){v.mount();v.mounted=true}else v.update();return true},isMounted(name){return !!m.get(name)?.mounted}}}

// performance.js
function createPerformanceController(root=typeof document!=='undefined'?document.documentElement:null){let mode='BALANCED';return {getVisualMode:()=>mode,setVisualMode(v){if(!['HIGH','BALANCED','ECO'].includes(v))return mode;mode=v;if(root){root.dataset.visual=mode.toLowerCase()}return mode}}}
const scheduleIdle=fn=>typeof requestIdleCallback==='function'?requestIdleCallback(fn,{timeout:800}):setTimeout(fn,80);
function rafThrottle(fn){let raf=0,args;return(...a)=>{args=a;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;fn(...args)})}}

// loader.js
const LOADER_TARGET_MS=3000;const LOADER_HARD_EXIT_MS=3600;
const phases=[['CORE INITIALIZE',0,500],['SHIFT MATRIX VERIFY',500,1300],['COMMAND GRID LINK',1300,2200],['INTERFACE READY',2200,3000]];
function loaderPhaseAt(ms){const e=Math.max(0,ms),p=e>=3000?100:e<500?Math.round(e/500*20):e<1300?20+Math.round((e-500)/800*30):e<2200?50+Math.round((e-1300)/900*30):80+Math.round((e-2200)/800*20);const phase=e<500?phases[0]:e<1300?phases[1]:e<2200?phases[2]:phases[3];return {label:phase[0],progress:Math.min(100,p)}}
function startLoader(){const o=document.getElementById('bootOverlay');if(!o)return;const bar=document.getElementById('bootBar'),pct=document.getElementById('bootPct'),phase=document.getElementById('bootPhase'),state=document.getElementById('bootState');const t0=performance.now();let raf=0,done=false;const tick=()=>{if(done)return;const x=loaderPhaseAt(performance.now()-t0);bar.style.transform=`scaleX(${x.progress/100})`;pct.textContent=`${x.progress}%`;phase.textContent=x.label;if(x.progress>=100)state.textContent='READY';raf=requestAnimationFrame(tick)};const close=()=>{if(done)return;done=true;cancelAnimationFrame(raf);bar.style.transform='scaleX(1)';pct.textContent='100%';phase.textContent='INTERFACE READY';state.textContent='READY';o.classList.add('boot-out');setTimeout(()=>o.remove(),320)};requestAnimationFrame(tick);setTimeout(close,LOADER_TARGET_MS);setTimeout(close,LOADER_HARD_EXIT_MS)}

// risk.js

const RISK_THRESHOLDS={LOW_STAFFING:6,LOW_NIGHT_COVERAGE:2,CONSECUTIVE_WORK:3,LONG_NIGHT_STREAK:3,D_N_IMBALANCE:3,HIGH_OFF_COUNT:5};
function evaluateDayRisk(day,cache,staff){const s=cache.dayStats[day],out=[];if(s.working<RISK_THRESHOLDS.LOW_STAFFING)out.push({level:'critical',code:'LOW STAFFING',text:`เข้าเวร ${s.working} คน`});if(s.N<RISK_THRESHOLDS.LOW_NIGHT_COVERAGE)out.push({level:'warning',code:'LOW NIGHT COVERAGE',text:`เวร N ${s.N} คน`});if(Math.abs(s.D-s.N)>=RISK_THRESHOLDS.D_N_IMBALANCE)out.push({level:'warning',code:'D/N IMBALANCE',text:`D ${s.D} / N ${s.N}`});if(s.OFF>=RISK_THRESHOLDS.HIGH_OFF_COUNT)out.push({level:'info',code:'HIGH OFF COUNT',text:`OFF ${s.OFF} คน`});staff.forEach((p,i)=>{const w=currentWorkStreak(staff,i,day),n=currentNightStreak(staff,i,day);if(w>=RISK_THRESHOLDS.CONSECUTIVE_WORK)out.push({level:'info',code:'WORK STREAK',text:`${p.name} ${w} วัน`});if(n>=RISK_THRESHOLDS.LONG_NIGHT_STREAK)out.push({level:'warning',code:'NIGHT STREAK',text:`${p.name} N ${n} คืน`})});return out}

// daily.js

function compareAdjacentDay(day,cache){const cur=cache.dayStats[day],pack=x=>x?{D:x.D-cur.D,N:x.N-cur.N,OFF:x.OFF-cur.OFF,working:x.working-cur.working,coverage:x.coverage-cur.coverage}:null;return {previous:day>1?pack(cache.dayStats[day-1]):null,next:day<31?pack(cache.dayStats[day+1]):null}}
function shiftTransitions(day,staff){if(day>=31)return [];return staff.map((p,i)=>({i,name:p.name,from:formatStatus(p.s[day-1]),to:formatStatus(p.s[day])})).filter(x=>x.from!==x.to)}
function dailyModel(day,cache,staff){const lists={D:[],N:[],OFF:[]};staff.forEach((p,i)=>{const c=p.s[day-1],k=c==='O'?'OFF':c;lists[k].push({i,name:p.name,status:k})});return {...lists,counts:cache.dayStats[day],coverage:cache.dayStats[day].coverage,comparison:compareAdjacentDay(day,cache),transitions:shiftTransitions(day,staff)}}

// network.js
const normalizeStrength=(raw,max)=>max?Math.round(raw/max*100):0;
function networkModel(center,cache,limit=6){const rel=cache.pairStats.filter(x=>x.a===center||x.b===center).map(x=>({...x,other:x.a===center?x.b:x.a})).sort((a,b)=>b.strength-a.strength);return {center,nodes:rel.slice(0,limit),relations:rel,top:rel[0]||null}}

// analytics.js
function analyticsModel(cache){return {people:cache.personStats.map(p=>({...p,deltaFromAvg:+(p.working-cache.teamStats.avgWork).toFixed(1)})),daily:cache.dayStats.slice(1),team:cache.teamStats}}

// command-palette.js

const paletteViews=['overview','daily','person','month','analytics','team'];
function parseCommandQuery(q){q=String(q||'').trim().toLowerCase();if(!q)return [];const out=[];const n=parseInt(q,10);if(n>=1&&n<=31)out.push({type:'day',day:n,label:`วันที่ ${n} ตุลาคม`});for(const v of paletteViews)if(v.includes(q)||q.includes(v))out.push({type:'view',view:v==='team'?'overview':v,label:v});const status=q==='d'||q.includes('day')||q.includes('กลางวัน')?'D':q==='n'||q.includes('night')||q.includes('กลางคืน')?'N':q.includes('off')?'O':null;if(status)out.push({type:'status',code:status,label:status==='O'?'OFF':status});STAFF.forEach((p,i)=>{if(p.name.toLowerCase().includes(q))out.push({type:'person',i,label:p.name})});return out}
function shouldOpenPalette(e){if(['INPUT','TEXTAREA','SELECT'].includes(e.targetTag)||e.contentEditable)return false;return e.key==='/'||((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k')}

// overview.js


function renderOverview(root,state,cache,onDay,onPerson){const d=state.selectedDay,s=cache.dayStats[d],meta=dateMeta(d);root.innerHTML=`
<section class="hero card"><div class="hero-copy"><span class="kicker">REAL-TIME WORKFORCE MATRIX</span><h1>ตุลาคม 2569</h1><p>October 2026 • ${meta.weekday}</p><div class="hero-date">${meta.thai}</div><div class="hero-actions"><button data-day="${Math.max(1,d-1)}">← วันก่อน</button><button data-day="${Math.min(31,d+1)}">วันถัดไป →</button></div></div><div class="hero-orbit" aria-hidden="true"><i></i><b>${d}</b></div></section>
<section class="metrics"><article class="metric card d"><span>D • DAY</span><strong>${s.D}</strong><small>คน</small></article><article class="metric card n"><span>N • NIGHT</span><strong>${s.N}</strong><small>คน</small></article><article class="metric card o"><span>OFF</span><strong>${s.OFF}</strong><small>คน</small></article><article class="metric card c"><span>COVERAGE</span><strong>${s.coverage}%</strong><small>${s.working}/10 เข้าเวร</small></article></section>
<section class="card timeline-card"><div class="section-head"><div><span class="kicker">OCTOBER TIMELINE</span><h2>เลือกวันที่</h2></div><span class="hint">คลิกวันที่เพื่อ Sync ทั้งระบบ</span></div><div class="timeline">${cache.dayStats.slice(1).map(x=>`<button class="day-chip ${x.day===d?'active':''}" data-day="${x.day}"><b>${x.day}</b><span>D${x.D} N${x.N}</span></button>`).join('')}</div></section>
<section class="overview-grid"><article class="card risk-summary"><div class="section-head"><div><span class="kicker">STAFFING SIGNAL</span><h2>ภาพรวมวันนี้</h2></div><span class="status-pill ${s.working<6?'danger':'ok'}">${s.working<6?'ATTENTION':'STABLE'}</span></div><div class="signal-grid"><div><span>Working</span><b>${s.working}</b></div><div><span>OFF</span><b>${s.OFF}</b></div><div><span>D:N</span><b>${s.D}:${s.N}</b></div><div><span>Coverage</span><b>${s.coverage}%</b></div></div></article><article class="card quick-team"><div class="section-head"><div><span class="kicker">TEAM SNAPSHOT</span><h2>กำลังเข้าเวร</h2></div></div><div class="mini-people">${STAFF.map((p,i)=>{const code=p.s[d-1],label=code==='O'?'OFF':code;return `<button data-person="${i}" class="mini-person"><span class="avatar">${i+1}</span><span><b>${p.name.replace(/^นาย ?/,'')}</b><small class="status ${label.toLowerCase()}">${label}</small></span></button>`}).join('')}</div></article></section>`;
root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>onDay(+b.dataset.day));root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>onPerson(+b.dataset.person));}

// person.js

function renderPerson(root,state,cache,onSelect){const i=state.selectedPerson,p=STAFF[i],x=cache.personStats[i];root.innerHTML=`<section class="card person-head"><div><span class="kicker">PERSON WORKLOAD</span><h1>${p.name}</h1><p>D ${x.D} • N ${x.N} • OFF ${x.OFF} • Work ${x.working}</p></div><div class="person-score"><b>${x.nightPct}%</b><span>Night share</span></div></section><section class="person-layout"><aside class="card person-list">${STAFF.map((q,j)=>`<button class="${j===i?'active':''}" data-person="${j}"><span>${j+1}</span><b>${q.name}</b></button>`).join('')}</aside><article class="card"><div class="section-head"><div><span class="kicker">31-DAY PATTERN</span><h2>ตารางรายบุคคล</h2></div></div><div class="person-calendar">${[...p.s].map((c,k)=>`<div class="cal-cell ${formatStatus(c).toLowerCase()}"><small>${k+1}</small><b>${formatStatus(c)}</b></div>`).join('')}</div><div class="stats-row"><div><span>Longest work streak</span><b>${x.longestWorkStreak} วัน</b></div><div><span>Longest N streak</span><b>${x.longestNightStreak} คืน</b></div><div><span>Team avg Δ</span><b>${(x.working-cache.teamStats.avgWork).toFixed(1)}</b></div></div></article></section>`;root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>onSelect(+b.dataset.person));}

// month.js

function renderMonth(root,state,onDay,onPerson){root.innerHTML=`<section class="card"><div class="section-head"><div><span class="kicker">MONTH MATRIX</span><h1>October 2569</h1></div><span class="hint">D แดง • N น้ำเงิน • OFF เขียว</span></div><div class="month-scroll"><table class="month-table"><thead><tr><th>พนักงาน</th>${Array.from({length:31},(_,i)=>`<th><button data-day="${i+1}">${i+1}</button></th>`).join('')}</tr></thead><tbody>${STAFF.map((p,i)=>`<tr><th><button data-person="${i}">${p.name.replace(/^นาย ?/,'')}</button></th>${[...p.s].map(c=>`<td class="${formatStatus(c).toLowerCase()}">${formatStatus(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>onDay(+b.dataset.day));root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>onPerson(+b.dataset.person));}

// mobile.js
function setupMobileSwipe(el,onDelta){if(!el)return;let sx=0,sy=0;el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});el.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.2)onDelta(dx<0?1:-1)},{passive:true})}

// app.js














const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state=createAppState(),cache=createScheduleCache(STAFF),views=createViewRegistry(),perf=createPerformanceController();
const viewRoot=name=>$(`#${name}View`);
function syncNav(name){state.activeView=name;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$$('.view').forEach(v=>v.classList.toggle('active',v.id===`${name}View`));views.show(name);window.scrollTo({top:0,behavior:'smooth'})}
function selectDay(day){state.setSelectedDay(day);if(views.isMounted('overview'))renderOverviewView();if(views.isMounted('daily'))renderDailyView();if(views.isMounted('analytics'))renderAnalyticsView()}
function selectPerson(i){state.setSelectedPerson(i);syncNav('person')}
function renderOverviewView(){renderOverview(viewRoot('overview'),state,cache,selectDay,selectPerson);renderNetworkPanel()}
function renderDailyView(){const root=viewRoot('daily'),d=state.selectedDay,m=dailyModel(d,cache,STAFF),risks=evaluateDayRisk(d,cache,STAFF),meta=dateMeta(d);const roster=(label,arr)=>`<article class="card roster ${label.toLowerCase()}"><div class="section-head"><div><span class="kicker">${label} SHIFT</span><h2>${label==='D'?'เวรกลางวัน':label==='N'?'เวรกลางคืน':'วันหยุด'}</h2></div><strong>${arr.length}</strong></div>${arr.map(x=>`<button class="person-row" data-person="${x.i}"><span class="avatar">${x.i+1}</span><span><b>${x.name}</b><small>${x.status}</small></span></button>`).join('')||'<p class="empty">ไม่มี</p>'}</article>`;root.innerHTML=`<div class="sticky-daily"><b>${d} ต.ค.</b><span class="d">D ${m.D.length}</span><span class="n">N ${m.N.length}</span><span class="o">OFF ${m.OFF.length}</span><span>${m.coverage}%</span></div><section class="card daily-hero"><div><span class="kicker">DAILY OPERATIONS</span><h1>${meta.thai}</h1><p>${meta.weekday} • Coverage ${m.coverage}%</p></div><div class="daily-controls"><button data-day="${Math.max(1,d-1)}" ${d===1?'disabled':''}>←</button><b>${d}</b><button data-day="${Math.min(31,d+1)}" ${d===31?'disabled':''}>→</button></div></section><section class="rosters">${roster('D',m.D)}${roster('N',m.N)}${roster('OFF',m.OFF)}</section><section class="daily-grid"><article class="card"><div class="section-head"><div><span class="kicker">DAY COMPARISON</span><h2>เทียบวันข้างเคียง</h2></div></div><div class="compare-grid">${['previous','next'].map(k=>{const x=m.comparison[k];return `<div><span>${k==='previous'?'วันก่อน':'วันถัดไป'}</span>${x?`<b>D ${x.D>=0?'+':''}${x.D} • N ${x.N>=0?'+':''}${x.N}</b><small>Coverage ${x.coverage>=0?'+':''}${x.coverage}%</small>`:'<b>N/A</b>'}</div>`}).join('')}</div></article><article class="card"><div class="section-head"><div><span class="kicker">SHIFT TRANSITIONS</span><h2>การเปลี่ยนเวร</h2></div></div><div class="transitions">${m.transitions.slice(0,8).map(x=>`<button data-person="${x.i}"><b>${x.name.replace(/^นาย ?/,'')}</b><span>${x.from} → ${x.to}</span></button>`).join('')||'<p class="empty">ไม่มีการเปลี่ยนสถานะ</p>'}</div></article><article class="card risk-card"><div class="section-head"><div><span class="kicker">STAFFING RISK</span><h2>สัญญาณประจำวัน</h2></div><span class="status-pill ${risks.some(x=>x.level==='critical')?'danger':'ok'}">${risks.length} SIGNALS</span></div><div class="risk-list">${risks.slice(0,10).map(r=>`<div class="risk ${r.level}"><span>${r.code}</span><b>${r.text}</b></div>`).join('')||'<div class="risk ok"><span>ALL CLEAR</span><b>ไม่พบสัญญาณเสี่ยง</b></div>'}</div></article></section>`;root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>selectDay(+b.dataset.day));root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>selectPerson(+b.dataset.person));}
function renderPersonView(){renderPerson(viewRoot('person'),state,cache,i=>{state.setSelectedPerson(i);renderPersonView()})}
function renderMonthView(){renderMonth(viewRoot('month'),state,d=>{selectDay(d);syncNav('daily')},selectPerson)}
function renderAnalyticsView(){const a=analyticsModel(cache),root=viewRoot('analytics'),d=state.selectedDay;root.innerHTML=`<section class="card"><div class="section-head"><div><span class="kicker">WORKLOAD BALANCE</span><h1>Analytics</h1></div><span class="hint">Team avg ${a.team.avgWork.toFixed(1)} วันทำงาน</span></div><div class="analytics-summary"><div><span>AVG WORK</span><b>${a.team.avgWork.toFixed(1)}</b></div><div><span>AVG N</span><b>${a.team.avgN.toFixed(1)}</b></div><div><span>BUSIEST</span><b>Day ${a.team.busiest.day}</b></div><div><span>LEAST</span><b>Day ${a.team.least.day}</b></div></div><div class="activity-chart">${a.daily.map(x=>`<button data-day="${x.day}" class="${x.day===d?'active':''}" title="Day ${x.day} D${x.D} N${x.N} OFF${x.OFF}"><i style="height:${Math.max(12,x.working*9)}%"></i><span>${x.day}</span></button>`).join('')}</div></section><section class="card table-card"><div class="section-head"><div><span class="kicker">PERSON LOAD</span><h2>สมดุลเวรทั้งทีม</h2></div></div><div class="workload-table"><div class="workload-row head"><span>พนักงาน</span><span>D</span><span>N</span><span>OFF</span><span>WORK</span><span>N%</span><span>STREAK</span><span>Δ AVG</span></div>${a.people.map(p=>`<button class="workload-row" data-person="${p.i}"><span>${p.name.replace(/^นาย ?/,'')}</span><span class="d">${p.D}</span><span class="n">${p.N}</span><span class="o">${p.OFF}</span><span>${p.working}</span><span>${p.nightPct}%</span><span>${p.longestWorkStreak}</span><span>${p.deltaFromAvg>0?'+':''}${p.deltaFromAvg}</span></button>`).join('')}</div></section>`;root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>selectDay(+b.dataset.day));root.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>selectPerson(+b.dataset.person));}
function renderNetworkPanel(){const host=$('#networkPanel');if(!host)return;const limit=innerWidth<700?4:innerWidth<1100?5:6,m=networkModel(state.selectedPerson,cache,limit),center=STAFF[state.selectedPerson];const plotted=m.nodes.map((r,k)=>{const angle=-150+k*(300/Math.max(1,m.nodes.length-1)),rad=angle*Math.PI/180;return {...r,x:50+38*Math.cos(rad),y:52+36*Math.sin(rad)}});host.innerHTML=`<div class="section-head"><div><span class="kicker">TEAM NETWORK 2.0</span><h2>ความสัมพันธ์ของทีม</h2></div><button class="link-btn" id="networkCenter">${center.name.replace(/^นาย ?/,'')}</button></div><div class="network-stage"><svg class="network-edges" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${plotted.map(r=>`<line x1="50" y1="52" x2="${r.x}" y2="${r.y}" style="--strength:${r.strength}"/>`).join('')}</svg><div class="network-core" data-person="${state.selectedPerson}"><span>${state.selectedPerson+1}</span><b>${center.name.replace(/^นาย ?/,'')}</b></div>${plotted.map(r=>`<button class="network-node" style="--x:${r.x}%;--y:${r.y}%;--s:${Math.max(.35,r.strength/100)}" data-person="${r.other}" title="Same ${r.sameShift} • D ${r.sameD} • N ${r.sameN} • Handoff ${r.handoff} • Strength ${r.strength}%"><span>${r.other+1}</span><b>${STAFF[r.other].name.replace(/^นาย ?/,'')}</b><small>${r.strength}%</small></button>`).join('')}</div><div class="network-relations">${m.relations.slice(0,5).map(r=>`<button data-person="${r.other}"><b>${STAFF[r.other].name.replace(/^นาย ?/,'')}</b><span>Same ${r.sameShift} • D ${r.sameD} • N ${r.sameN} • Handoff ${r.handoff}</span><strong>${r.strength}%</strong></button>`).join('')}</div>`;host.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{state.setSelectedPerson(+b.dataset.person);renderNetworkPanel()});$('#networkCenter').onclick=()=>syncNav('person')}
views.register('overview',renderOverviewView,renderOverviewView);views.register('daily',renderDailyView,renderDailyView);views.register('person',renderPersonView,renderPersonView);views.register('month',renderMonthView,renderMonthView);views.register('analytics',renderAnalyticsView,renderAnalyticsView);
$$('[data-view]').forEach(b=>b.onclick=()=>syncNav(b.dataset.view));
function setVisual(mode){perf.setVisualMode(mode);$$('[data-quality]').forEach(b=>b.classList.toggle('active',b.dataset.quality===mode))}setVisual('BALANCED');$$('[data-quality]').forEach(b=>b.onclick=()=>setVisual(b.dataset.quality));
const pal=$('#palette'),palInput=$('#paletteInput'),palResults=$('#paletteResults');let palIndex=0,palItems=[];function closePalette(){pal.classList.remove('open')}function drawPalette(){palItems=parseCommandQuery(palInput.value).slice(0,8);palIndex=Math.min(palIndex,Math.max(0,palItems.length-1));palResults.innerHTML=palItems.map((x,i)=>`<button class="${i===palIndex?'active':''}" data-i="${i}"><span>${x.label||x.view||x.code}</span><small>${x.type}</small></button>`).join('')||'<p>ลองพิมพ์วันที่, ชื่อ, night, off, analytics</p>';palResults.querySelectorAll('button').forEach(b=>b.onclick=()=>runPalette(+b.dataset.i))}function runPalette(i){const x=palItems[i];if(!x)return;if(x.type==='day'){selectDay(x.day);syncNav('daily')}else if(x.type==='person')selectPerson(x.i);else if(x.type==='view')syncNav(x.view);else if(x.type==='status')syncNav('daily');closePalette()}function openPalette(){pal.classList.add('open');palInput.value='';palIndex=0;drawPalette();setTimeout(()=>palInput.focus(),10)}
palInput.oninput=drawPalette;palInput.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();palIndex=Math.min(palItems.length-1,palIndex+1);drawPalette()}if(e.key==='ArrowUp'){e.preventDefault();palIndex=Math.max(0,palIndex-1);drawPalette()}if(e.key==='Enter'){e.preventDefault();runPalette(palIndex)}if(e.key==='Escape')closePalette()};$('#paletteClose').onclick=closePalette;$('#commandBtn').onclick=openPalette;document.addEventListener('keydown',e=>{if(shouldOpenPalette({key:e.key,ctrlKey:e.ctrlKey,metaKey:e.metaKey,targetTag:e.target.tagName,contentEditable:e.target.isContentEditable})){e.preventDefault();openPalette()}else if(e.key==='Escape')closePalette()});
setupMobileSwipe(viewRoot('daily'),delta=>selectDay(state.selectedDay+delta));
views.show('overview');scheduleIdle(()=>{ /* cache already computed; idle slot intentionally left for future derived work */ });startLoader();
window.addEventListener('resize',()=>{if(views.isMounted('overview'))renderNetworkPanel()},{passive:true});
</script></body></html>
