name: v6.5 Sync Production Index

on:
  push:
    branches:
      - 'work/v6.5-sharp-ui-i18n'

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5-sharp-ui-i18n
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build production index
        run: npm run build
      - name: Commit generated index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: sync v6.5 production index"
            git push origin HEAD:work/v6.5-sharp-ui-i18n
          else
            echo "index.html already synchronized"
          fi
      - name: Verify synchronized branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v65-ci.yml --ref work/v6.5-sharp-ui-i18n
