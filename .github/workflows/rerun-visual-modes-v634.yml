name: Rerun Visual Modes v6.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rerun-visual-modes-v634.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm visual profile test is RED
        shell: bash
        run: |
          cat > tests/visual-modes.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          test('visual modes provide distinct HIGH BALANCED and ECO profiles',()=>{
            const css=fs.readFileSync('src/styles.css','utf8');
            const tpl=fs.readFileSync('src/template.html','utf8');
            assert.match(css,/html\[data-visual="high"\]/);
            assert.match(css,/html\[data-visual="balanced"\]/);
            assert.match(css,/html\[data-visual="eco"\]/);
            assert.match(css,/@keyframes highAmbientDrift/);
            assert.match(css,/@keyframes highRadarSweep/);
            assert.match(css,/html\[data-visual="high"\][\s\S]*\.network-edges line[\s\S]*animation:/);
            assert.match(css,/html\[data-visual="balanced"\][\s\S]*\.ambient[\s\S]*animation:none/);
            assert.match(css,/html\[data-visual="eco"\][\s\S]*animation:none!important/);
            assert.match(tpl,/data-app-version="6\.3\.4"/);
          });
          EOF
          set +e
          node --test tests/visual-modes.test.mjs
          code=$?
          set -e
          test "$code" -ne 0
          echo 'RED confirmed'

      - name: Apply approved v6.3.4 visual profiles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tpl=Path('src/template.html')
          s=tpl.read_text()
          s=s.replace('data-app-version="6.3"','data-app-version="6.3.4"')
          s=s.replace('BOOT SEQUENCE • v6.3','BOOT SEQUENCE • v6.3.4')
          tpl.write_text(s)

          wf=Path('.github/workflows/apply-visual-modes-v634.yml').read_text()
          marker="          cat >> src/styles.css <<'EOF'\n"
          block=wf.split(marker,1)[1].split("\n          EOF\n",1)[0]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          css=Path('src/styles.css')
          base=css.read_text()
          if '/* Visual Modes v6.3.4' not in base:
              css.write_text(base+'\n'+'\n'.join(lines)+'\n')
          PY

      - name: Build and test complete production package
        shell: bash
        run: |
          npm run build
          npm test

      - name: Verify v6.3.4 release invariants
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const x of ['data-app-version="6.3.4"','html[data-visual="high"]','html[data-visual="balanced"]','html[data-visual="eco"]','highAmbientDrift','highRadarSweep','นาย นลิทัศน์ นากรณ์','OOOOODDDDOODDDDOOOODDOOOONNNNNN']) if(!s.includes(x)) throw new Error('missing '+x);
          for(const x of ['document.write(', 'DecompressionStream', '${[[']) if(s.includes(x)) throw new Error('bad output '+x);
          const cfg=fs.readFileSync('wrangler.jsonc','utf8');
          if(!cfg.includes('"directory": "./"')) throw new Error('Cloudflare assets config changed');
          const ignore=fs.readFileSync('.assetsignore','utf8');
          if(!ignore.includes('!index.html')) throw new Error('asset allowlist missing');
          console.log('v6.3.4 release invariants OK');
          NODE

      - name: Commit verified v6.3.4 and clean temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-visual-modes-v634.yml .github/workflows/rerun-visual-modes-v634.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add visual performance modes v6.3.4'
          git push origin HEAD:main
