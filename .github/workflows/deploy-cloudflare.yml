name: Deploy Shift to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shift-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build PWA and icon assets
        run: npm run build
      - name: Verify generated HTML
        run: git diff --exit-code -- index.html
      - name: Test
        run: npm test
      - name: Verify icon assets
        run: |
          test -s icons/shift-192.png
          test -s icons/shift-512.png
          test -s icons/shift-maskable-512.png
          test -s icons/shift-180.png
          test -s icons/shift-32.png
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Build/tests finished. Deployment not started: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
