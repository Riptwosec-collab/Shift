name: Deploy Shift to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shift-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare API token::Add repository secret CLOUDFLARE_API_TOKEN before deployment can run."
            exit 1
          fi

      - name: Prepare static assets
        run: |
          rm -rf public
          mkdir -p public
          cp index.html public/index.html
          test -s public/index.html
          grep -q "UI LOADER v6" public/index.html

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 59c8486fec5f9585fecdd0fa5fc584b9
          command: deploy
