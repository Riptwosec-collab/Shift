name: Clean Shift UI v5 temp files

on:
  push:
    paths:
      - '.github/workflows/apply-v5.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployed dashboard before cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip, hashlib
          text = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r"const b64='([^']+)'", text)
          if not m:
              raise SystemExit('deployed payload not found')
          html = gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          sha = hashlib.sha256(html.encode()).hexdigest()
          expected = 'bb8869ed739e1c1b077957f49bc79bfc548adc23645aa91a044fa3876fae2966'
          if sha != expected or '/* UI READABILITY V5 */' not in html:
              raise SystemExit('deployed dashboard verification failed')
          print('VERIFIED deployed v5', sha)
          PY

      - name: Remove temporary deployment files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r payload payloadv5 v5.css .github/workflows/apply-v5.yml
          git commit -m 'Clean temporary v5 deployment files'
          git push
