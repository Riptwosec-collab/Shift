name: Apply Visual Modes v6.3.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-visual-modes-v634.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add visual mode regression test and confirm RED
        shell: bash
        run: |
          cat > tests/visual-modes.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('visual modes provide distinct HIGH BALANCED and ECO profiles',()=>{
            const css=fs.readFileSync('src/styles.css','utf8');
            const tpl=fs.readFileSync('src/template.html','utf8');
            assert.match(css,/html\[data-visual="high"\]/);
            assert.match(css,/html\[data-visual="balanced"\]/);
            assert.match(css,/html\[data-visual="eco"\]/);
            assert.match(css,/@keyframes highAmbientDrift/);
            assert.match(css,/@keyframes highRadarSweep/);
            assert.match(css,/html\[data-visual="high"\][\s\S]*\.network-edges line[\s\S]*animation:/);
            assert.match(css,/html\[data-visual="balanced"\][\s\S]*\.ambient[\s\S]*animation:none/);
            assert.match(css,/html\[data-visual="eco"\][\s\S]*animation:none!important/);
            assert.match(tpl,/data-app-version="6\.3\.4"/);
          });
          EOF
          set +e
          node --test tests/visual-modes.test.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected RED test to fail before implementation'
            exit 1
          fi
          echo 'RED confirmed'

      - name: Implement visual profiles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/template.html')
          s=p.read_text()
          s=s.replace('data-app-version="6.3"','data-app-version="6.3.4"')
          s=s.replace('BOOT SEQUENCE • v6.3','BOOT SEQUENCE • v6.3.4')
          p.write_text(s)
          PY
          cat >> src/styles.css <<'EOF'

          /* Visual Modes v6.3.4 -------------------------------------------------- */
          @keyframes highAmbientDrift{0%{transform:translate3d(-2%,0,0) scale(1)}50%{transform:translate3d(4%,-3%,0) scale(1.08)}100%{transform:translate3d(-1%,4%,0) scale(.96)}}
          @keyframes highGridScan{0%{transform:translate3d(0,-22%,0)}100%{transform:translate3d(0,122%,0)}}
          @keyframes highRingSpin{to{transform:rotate(360deg)}}
          @keyframes highRingSpinReverse{to{transform:rotate(-360deg)}}
          @keyframes highRadarSweep{to{transform:translate(-50%,-50%) rotate(360deg)}}
          @keyframes highSignalDash{to{stroke-dashoffset:-24}}
          @keyframes highNodePulse{0%,100%{filter:brightness(1);box-shadow:0 0 12px #2d8cff20,inset 0 0 20px #41e9ff0d}50%{filter:brightness(1.16);box-shadow:0 0 28px #41e9ff36,inset 0 0 28px #8568ff16}}
          @keyframes highCorePulse{0%,100%{box-shadow:0 0 36px #2d8cff28,inset 0 0 34px #41e9ff12}50%{box-shadow:0 0 70px #41e9ff42,0 0 110px #8568ff1c,inset 0 0 45px #41e9ff20}}
          @keyframes highHeroScan{0%{transform:translateX(-115%) skewX(-16deg);opacity:0}18%{opacity:.55}55%{opacity:.22}100%{transform:translateX(145%) skewX(-16deg);opacity:0}}

          html[data-visual="high"]{--shadow:0 22px 70px #000b,0 0 34px #188dca12}
          html[data-visual="high"] body{background:radial-gradient(circle at 72% -8%,#123c78 0,transparent 30%),radial-gradient(circle at 10% 55%,#063e57 0,transparent 28%),radial-gradient(circle at 92% 78%,#28165c 0,transparent 31%),linear-gradient(180deg,#010611,#03101c 56%,#030716)}
          html[data-visual="high"] .ambient{opacity:.18;filter:blur(78px) saturate(1.35);animation:highAmbientDrift 13s ease-in-out infinite alternate;will-change:transform}
          html[data-visual="high"] .bg-grid{opacity:1;background-size:38px 38px;filter:drop-shadow(0 0 7px #23dfff18)}
          html[data-visual="high"] .bg-grid::before{content:"";position:absolute;inset:-30% 0;background:linear-gradient(180deg,transparent 35%,#41e9ff0a 49%,#41e9ff24 50%,#41e9ff0a 51%,transparent 65%);animation:highGridScan 7.5s linear infinite;will-change:transform}
          html[data-visual="high"] .topbar{background:#04101de8;border-color:#41e9ff38;box-shadow:0 14px 42px #000a,0 0 28px #2d8cff0f;backdrop-filter:blur(16px) saturate(1.2)}
          html[data-visual="high"] .card{background:linear-gradient(155deg,#0b2138ed,#061522ec 56%,#0b1029ec);border-color:#41e9ff2c;box-shadow:var(--shadow);backdrop-filter:blur(14px) saturate(1.16)}
          html[data-visual="high"] .hero{background:radial-gradient(circle at 77% 28%,#2d8cff3d,transparent 24%),radial-gradient(circle at 61% 85%,#6c4cff1d,transparent 30%),linear-gradient(130deg,#0b243c,#041420 58%,#12102f);box-shadow:inset 0 0 80px #2d8cff0b,var(--shadow)}
          html[data-visual="high"] .hero::after{content:"";position:absolute;inset:-10% -35%;pointer-events:none;background:linear-gradient(100deg,transparent 42%,#41e9ff00 45%,#41e9ff17 49%,#ffffff25 50%,#8568ff13 52%,transparent 57%);animation:highHeroScan 5.8s ease-in-out infinite;will-change:transform}
          html[data-visual="high"] .hero-orbit{border-color:#41e9ff70;box-shadow:0 0 70px #2d8cff2c,0 0 110px #8568ff12,inset 0 0 55px #41e9ff12}
          html[data-visual="high"] .hero-orbit::before{animation:highRingSpin 10s linear infinite}
          html[data-visual="high"] .hero-orbit::after{animation:highRingSpinReverse 7s linear infinite}
          html[data-visual="high"] .metric{background:linear-gradient(155deg,#0b1d31f2,#061422ee);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
          html[data-visual="high"] .metric:hover{transform:translateY(-2px);border-color:#41e9ff38}
          html[data-visual="high"] .network-stage{background:radial-gradient(circle at 50% 52%,#2d8cff28,transparent 29%),radial-gradient(circle at 50% 52%,transparent 0 32%,#41e9ff11 32.4% 32.8%,transparent 33%),linear-gradient(#41e9ff0b 1px,transparent 1px),linear-gradient(90deg,#41e9ff0b 1px,transparent 1px);background-size:auto,auto,30px 30px,30px 30px;box-shadow:inset 0 0 55px #2d8cff10}
          html[data-visual="high"] .network-stage::before{content:"";position:absolute;left:50%;top:50%;width:190px;height:190px;border-radius:50%;background:conic-gradient(from 0deg,#41e9ff00 0 78%,#41e9ff18 87%,#41e9ff70 99%,#41e9ff00 100%);transform:translate(-50%,-50%);animation:highRadarSweep 5.4s linear infinite;pointer-events:none;opacity:.72;will-change:transform}
          html[data-visual="high"] .network-edges line{stroke-dasharray:5 4;animation:highSignalDash 3.2s linear infinite;filter:drop-shadow(0 0 1.8px #41e9ff)}
          html[data-visual="high"] .network-core{animation:highCorePulse 3.4s ease-in-out infinite}
          html[data-visual="high"] .network-node{animation:highNodePulse 4.6s ease-in-out infinite}
          html[data-visual="high"] .network-node:nth-of-type(2n){animation-delay:-1.4s}
          html[data-visual="high"] .day-chip.active{box-shadow:0 0 28px #2d8cff2b,inset 0 0 20px #41e9ff0a}
          html[data-visual="high"] .quality button.active{box-shadow:0 0 18px #41e9ff20,inset 0 0 0 1px #41e9ff24}
          html[data-visual="high"] .view.active{animation:viewIn .26s cubic-bezier(.2,.8,.2,1)}

          html[data-visual="balanced"]{--shadow:0 16px 46px #0008}
          html[data-visual="balanced"] .ambient{opacity:.07;filter:blur(90px);animation:none}
          html[data-visual="balanced"] .bg-grid{opacity:.72;filter:none}
          html[data-visual="balanced"] .bg-grid::before{display:none}
          html[data-visual="balanced"] .topbar{backdrop-filter:blur(8px)}
          html[data-visual="balanced"] .card{backdrop-filter:blur(5px);box-shadow:var(--shadow)}
          html[data-visual="balanced"] .hero::after{display:none}
          html[data-visual="balanced"] .hero-orbit::before{animation:highRingSpin 22s linear infinite}
          html[data-visual="balanced"] .hero-orbit::after{animation:none}
          html[data-visual="balanced"] .network-stage::before{display:none}
          html[data-visual="balanced"] .network-edges line,html[data-visual="balanced"] .network-core,html[data-visual="balanced"] .network-node{animation:none;filter:none}
          html[data-visual="balanced"] .metric{transition:transform .12s ease}
          html[data-visual="balanced"] .metric:hover{transform:translateY(-1px)}

          html[data-visual="eco"]{--shadow:0 8px 24px #0006}
          html[data-visual="eco"] *,html[data-visual="eco"] *::before,html[data-visual="eco"] *::after{animation:none!important;transition-duration:.08s!important;scroll-behavior:auto!important}
          html[data-visual="eco"] body{background:linear-gradient(180deg,#030914,#050d18 62%,#030914)}
          html[data-visual="eco"] .ambient{display:none!important;filter:none}
          html[data-visual="eco"] .bg-grid{opacity:.28;filter:none;background-size:48px 48px}
          html[data-visual="eco"] .bg-grid::before{display:none}
          html[data-visual="eco"] .topbar{background:#06111df5;backdrop-filter:none;box-shadow:0 8px 20px #0006}
          html[data-visual="eco"] .card{background:#071522f5;backdrop-filter:none;box-shadow:var(--shadow);border-color:#24455a24}
          html[data-visual="eco"] .hero{background:linear-gradient(130deg,#0a1d31,#07121f 62%,#0c1025);box-shadow:var(--shadow)}
          html[data-visual="eco"] .hero::after{display:none}
          html[data-visual="eco"] .hero-orbit{box-shadow:none;border-color:#2b6c8955}
          html[data-visual="eco"] .network-stage{background:linear-gradient(#41e9ff05 1px,transparent 1px),linear-gradient(90deg,#41e9ff05 1px,transparent 1px);background-size:44px 44px;box-shadow:none}
          html[data-visual="eco"] .network-stage::before{display:none}
          html[data-visual="eco"] .network-edges line{stroke-dasharray:none;filter:none;opacity:.28}
          html[data-visual="eco"] .network-core,html[data-visual="eco"] .network-node{box-shadow:none;filter:none}
          html[data-visual="eco"] .metric,html[data-visual="eco"] .day-chip.active,html[data-visual="eco"] .quality button.active{box-shadow:none}
          html[data-visual="eco"] .view.active{animation:none!important}
          EOF

      - name: Build and run complete tests
        shell: bash
        run: |
          npm run build
          npm test

      - name: Verify production visual profiles and invariants
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          for(const x of ['data-app-version="6.3.4"','html[data-visual="high"]','html[data-visual="balanced"]','html[data-visual="eco"]','highAmbientDrift','highRadarSweep','นาย นลิทัศน์ นากรณ์','OOOOODDDDOODDDDOOOODDOOOONNNNNN']) if(!s.includes(x)) throw new Error('missing '+x);
          for(const x of ['document.write(', 'DecompressionStream', '${[[']) if(s.includes(x)) throw new Error('legacy/broken output '+x);
          console.log('v6.3.4 visual profiles + release invariants OK');
          NODE
          test '"'"'"directory"'"'"': '"'"'"./"'"'"' -n wrangler.jsonc >/dev/null || true

      - name: Commit v6.3.4 and cleanup workflow
        shell: bash
        run: |
          rm .github/workflows/apply-visual-modes-v634.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add visual performance modes v6.3.4'
          git push origin HEAD:main
