name: v6.5 Sharp UI CI

on:
  push:
    branches:
      - 'work/v6.5-sharp-ui-smooth-boot-i18n'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Verify tracked index matches source build
        run: git diff --exit-code -- index.html
      - name: Test
        run: npm test
      - name: Verify release gates
        run: node --test tests/v65-*.test.mjs tests/v64-release.test.mjs tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs tests/v64-interactive.test.mjs
