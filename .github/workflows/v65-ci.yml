name: v6.5 Sharp UI CI

on:
  push:
    branches:
      - 'work/v6.5-sharp-ui-smooth-boot-i18n'
      - 'work/v6.5.1-engineer-oncall'
      - 'work/v6.5.2-oncall-matrix'
      - 'work/v6.5.3-oncall-loader-polish'
      - 'work/v6.5.4-oncall-global-redesign'
      - 'work/v6.5.5-global-neon-oncall'
      - 'work/v6.5.6-vivid-overview-focus'
      - 'work/v6.5.7-overview-dual-matrix-graphics'
      - 'work/v6.5.8-oncall-command-center'
      - 'work/v6.5.9-year-end-matrix'
      - 'work/v6.5.10-compact-three-month-matrix'
      - 'work/v6.5.11-zero-scroll-matrix'
      - 'work/v6.5.12-matrix-typography-clarity'
      - 'work/v6.5.13-pwa-responsive-all-views'
      - 'work/v6.5.14-mobile-pwa-daily-fast-nav'
      - 'work/v6.5.15-pwa-mobile-native-performance'
      - 'work/v6.5.16-trueblack-liquidglass-fast-pwa'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Verify tracked index matches source build
        run: git diff --exit-code -- index.html
      - name: Test
        run: npm test
      - name: Verify release gates
        run: node --test tests/v65-*.test.mjs tests/v651-*.test.mjs tests/v652-*.test.mjs tests/v653-*.test.mjs tests/v654-*.test.mjs tests/v655-*.test.mjs tests/v656-*.test.mjs tests/v657-*.test.mjs tests/v658-*.test.mjs tests/v659-*.test.mjs tests/v6510-*.test.mjs tests/v6511-*.test.mjs tests/v6512-*.test.mjs tests/v6513-*.test.mjs tests/v6514-*.test.mjs tests/v6515-*.test.mjs tests/v6516-*.test.mjs tests/v64-release.test.mjs tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs tests/v64-interactive.test.mjs
