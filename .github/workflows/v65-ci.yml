name: v6.5 Sharp UI CI

on:
  push:
    branches:
      - 'work/v6.5-sharp-ui-smooth-boot-i18n'
      - 'work/v6.5.1-engineer-oncall'
      - 'work/v6.5.2-oncall-matrix'
      - 'work/v6.5.3-oncall-loader-polish'
      - 'work/v6.5.4-oncall-global-redesign'
      - 'work/v6.5.5-global-neon-oncall'
      - 'work/v6.5.6-vivid-overview-focus'
      - 'work/v6.5.7-overview-dual-matrix-graphics'
      - 'work/v6.5.8-oncall-command-center'
      - 'work/v6.5.9-year-end-matrix'
      - 'work/v6.5.10-compact-three-month-matrix'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Sync generated v6.5.10 index
        if: github.ref_name == 'work/v6.5.10-compact-three-month-matrix'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: sync generated v6.5.10 index"
            git push
          fi
      - name: Verify tracked index matches source build
        run: git diff --exit-code -- index.html
      - name: Test
        run: npm test
      - name: Verify release gates
        run: node --test tests/v65-*.test.mjs tests/v651-*.test.mjs tests/v652-*.test.mjs tests/v653-*.test.mjs tests/v654-*.test.mjs tests/v655-*.test.mjs tests/v656-*.test.mjs tests/v657-*.test.mjs tests/v658-*.test.mjs tests/v659-*.test.mjs tests/v6510-*.test.mjs tests/v64-release.test.mjs tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs tests/v64-interactive.test.mjs
