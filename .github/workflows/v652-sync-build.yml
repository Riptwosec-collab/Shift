name: v6.5.2 Build Sync

on:
  push:
    branches:
      - 'work/v6.5.2-oncall-matrix'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v6.5.2-oncall-matrix
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npm run build
      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already synced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync v6.5.2 production index"
          git push
