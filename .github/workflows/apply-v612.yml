name: Apply loader v6.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v612.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply loader architecture fix
        run: python .github/v612_apply.py

      - name: Verify transformed dashboard
        run: |
          grep -q 'data-loader-version="6.1.2"' index.html
          grep -q 'id="overviewView"' index.html
          grep -q 'id="v61-runtime-patch"' index.html
          ! grep -q 'document.write(html)' index.html
          ! grep -q 'DecompressionStream' index.html
          ! grep -q 'const payloadB64' index.html

      - name: Commit fix and remove temporary files
        run: |
          rm -f .github/workflows/apply-v612.yml .github/v612_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix loader handoff v6.1.2'
          git push origin HEAD:main
