name: Apply Shift Command Center v6.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v63.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified v6.3 source package
        shell: bash
        run: |
          cat > /tmp/v63.b64 <<'PAYLOAD'
[... truncated for brevity in this rewrite ...]
PAYLOAD
          base64 -d /tmp/v63.b64 > /tmp/v63.tgz
          tar -xzf /tmp/v63.tgz

      - name: Verify source and build production index
        shell: bash
        run: |
          npm test
          npm run build
          npm test
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('index.html','utf8');
          if(!s.includes('data-app-version="6.3"')) throw new Error('v6.3 marker missing');
          if(!s.includes('LOADER_TARGET_MS=3000')) throw new Error('3 second loader missing');
          if(s.includes('document.write(')||s.includes('DecompressionStream')) throw new Error('legacy loader mechanism found');
          NODE

      - name: Commit v6.3 and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v63.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ship Shift Command Center v6.3'
          git push origin HEAD:main
