name: Apply Shift Command Center v6.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v63.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified v6.3 package
        shell: bash
        run: |
          cat .v63/payload{00..05} | base64 -d > /tmp/v63.tgz
          tar -tzf /tmp/v63.tgz
          tar -xzf /tmp/v63.tgz

      - name: Test source logic before build
        shell: bash
        run: |
          node --test \
            tests/data.test.mjs \
            tests/cache.test.mjs \
            tests/core.test.mjs \
            tests/loader.test.mjs \
            tests/daily-risk.test.mjs \
            tests/network.test.mjs \
            tests/analytics.test.mjs \
            tests/command-palette.test.mjs

      - name: Build standalone production index
        shell: bash
        run: npm run build

      - name: Test complete built production package
        shell: bash
        run: npm test

      - name: Verify release invariants
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('index.html','utf8');
          const required = [
            'data-app-version="6.3"',
            'LOADER_TARGET_MS=3000',
            'นาย นลิทัศน์ นากรณ์',
            'นายกิตติศักดิ์ วัชรรังสิมันต์',
            'OOOOODDDDOODDDDOOOODDOOOONNNNNN',
            'DDOODDDDOOOOODDOOODDDDDOOONNNNO'
          ];
          for (const x of required) if (!s.includes(x)) throw new Error('missing invariant: '+x);
          for (const x of ['document.write(', 'DecompressionStream']) if (s.includes(x)) throw new Error('legacy runtime found: '+x);
          console.log('v6.3 release invariants OK');
          NODE

      - name: Commit release and remove staging files
        shell: bash
        run: |
          rm -rf .v63 .github/workflows/apply-v63.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Ship Shift Command Center v6.3'
          git push origin HEAD:main
