name: Apply interactive loader v6

on:
  push:
    paths:
      - '.github/workflows/apply-loader-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build loader v6 around existing dashboard payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, gzip, base64, hashlib

          index = Path('index.html')
          current = index.read_text(encoding='utf-8')

          m = re.search(r"const b64=['\"]([^'\"]+)['\"]", current)
          if not m:
              m = re.search(r"const payloadB64\s*=\s*['\"]([^'\"]+)['\"]", current)
          if not m:
              raise SystemExit('dashboard payload not found in current index.html')

          payload = m.group(1)
          raw = gzip.decompress(base64.b64decode(payload)).decode('utf-8')

          if 'const staff=[' not in raw or raw.count('name:') < 10:
              raise SystemExit('embedded dashboard data check failed')

          template_gz_b64 = ''
          template = gzip.decompress(base64.b64decode(template_gz_b64)).decode('utf-8')
          if '__PAYLOAD__' not in template:
              raise SystemExit('loader template placeholder missing')

          updated = template.replace('__PAYLOAD__', payload, 1)
          if 'UI LOADER v6' not in updated or 'Skip intro' not in updated:
              raise SystemExit('loader v6 verification failed')

          index.write_text(updated, encoding='utf-8')
          print('dashboard sha256:', hashlib.sha256(raw.encode()).hexdigest())
          print('index sha256:', hashlib.sha256(updated.encode()).hexdigest())
          print('index bytes:', len(updated.encode()))
          PY

      - name: Commit loader v6 and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/apply-loader-v6.yml
          git commit -m 'Add interactive loader v6'
          git push
