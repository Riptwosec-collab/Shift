name: Fix rendered navigation v6.3.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-navigation-v633.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add regression test and confirm RED
        shell: bash
        run: |
          cat > tests/navigation-template.test.mjs <<'TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          test('desktop and mobile navigation are rendered as static buttons',()=>{
            const template=fs.readFileSync('src/template.html','utf8');
            assert.doesNotMatch(template, /<nav>\$\{/);
            assert.doesNotMatch(template, /<nav class="mobile-nav">\$\{/);
            for (const view of ['overview','daily','person','month','analytics']) {
              assert.match(template,new RegExp(`data-view="${view}"`));
            }
            assert.match(template,/<nav><button data-view="overview" class="active">Overview<\/button>/);
            assert.match(template,/<nav class="mobile-nav"><button data-view="overview" class="active">Home<\/button>/);
          });
          TEST
          set +e
          node --test tests/navigation-template.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected regression test to fail before the fix, but it passed.'
            exit 1
          fi
          echo 'RED confirmed: current template leaks JS template source into HTML.'

      - name: Fix navigation at template source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/template.html')
          s=p.read_text()
          old_desktop="""<nav>${[['overview','Overview'],['daily','Daily'],['person','Person'],['month','Month'],['analytics','Analytics']].map(x=>`<button data-view="${x[0]}" class="${x[0]==='overview'?'active':''}">${x[1]}</button>`).join('')}</nav>"""
          new_desktop="""<nav><button data-view="overview" class="active">Overview</button><button data-view="daily">Daily</button><button data-view="person">Person</button><button data-view="month">Month</button><button data-view="analytics">Analytics</button></nav>"""
          old_mobile="""<nav class="mobile-nav">${[['overview','Home'],['daily','Daily'],['person','Person'],['month','Month'],['analytics','Stats']].map(x=>`<button data-view="${x[0]}" class="${x[0]==='overview'?'active':''}">${x[1]}</button>`).join('')}</nav>"""
          new_mobile="""<nav class="mobile-nav"><button data-view="overview" class="active">Home</button><button data-view="daily">Daily</button><button data-view="person">Person</button><button data-view="month">Month</button><button data-view="analytics">Stats</button></nav>"""
          if old_desktop not in s:
              raise SystemExit('desktop navigation source pattern not found')
          if old_mobile not in s:
              raise SystemExit('mobile navigation source pattern not found')
          s=s.replace(old_desktop,new_desktop,1).replace(old_mobile,new_mobile,1)
          p.write_text(s)
          PY

      - name: Build and run complete test suite
        shell: bash
        run: |
          npm run build
          npm test

      - name: Verify production HTML navigation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          if (s.includes('<nav>${')) throw new Error('desktop navigation still contains raw template expression');
          if (s.includes('<nav class="mobile-nav">${')) throw new Error('mobile navigation still contains raw template expression');
          const required=[
            '<button data-view="overview" class="active">Overview</button>',
            '<button data-view="daily">Daily</button>',
            '<button data-view="person">Person</button>',
            '<button data-view="month">Month</button>',
            '<button data-view="analytics">Analytics</button>',
            '<nav class="mobile-nav"><button data-view="overview" class="active">Home</button>'
          ];
          for (const x of required) if (!s.includes(x)) throw new Error('missing navigation markup: '+x);
          for (const x of ['นาย นลิทัศน์ นากรณ์','นายกิตติศักดิ์ วัชรรังสิมันต์','LOADER_TARGET_MS=3000']) {
            if (!s.includes(x)) throw new Error('release invariant missing: '+x);
          }
          console.log('production navigation verified');
          NODE

      - name: Commit fixed production build and cleanup workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-navigation-v633.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix rendered navigation v6.3.3'
          git push origin HEAD:main
