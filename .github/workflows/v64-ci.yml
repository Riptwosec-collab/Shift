name: v6.4 Legacy UI CI

on:
  push:
    branches:
      - 'work/v6.4-legacy-ui-new-engine'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify production
        run: node --test tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs
