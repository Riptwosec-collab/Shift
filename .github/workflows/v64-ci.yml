name: v6.4 Legacy UI CI

on:
  push:
    branches:
      - 'work/v6.4-legacy-ui-new-engine'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify tracked index matches source build
        run: git diff --exit-code -- index.html
      - name: Test
        run: npm test
      - name: Verify production
        run: node --test tests/v64-release.test.mjs tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs tests/v64-interactive.test.mjs
