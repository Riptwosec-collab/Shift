name: Apply loader v6.1.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-v613.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/apply_v613.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,body in enumerate(scripts):
              f=Path(f'/tmp/check-{i}.js')
              f.write_text(body,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JS syntax failed in script {i}')
          print('JS syntax checks passed:',len(scripts))
          PY
      - name: Commit result
        run: |
          rm -f .github/workflows/apply-v613.yml .github/apply_v613.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix page hang and merge loader v6.1.3'
          git push origin HEAD:main
