name: Apply v6.2 visual upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v620.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/v620_patch.py

      - name: Verify v6.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'visual patch':'id="v62-visual-patch"' in s,
            'safe network geometry':'cy=H*.46,r=Math.min(W*.31,H*.30)' in s,
            'loader version':'data-loader-version="6.2.0"' in s,
            'network containment':'.network-panel{height:auto!important;min-height:360px!important;overflow:hidden!important}' in s,
            'safe observer':'offObserver.disconnect();normalizeOff();offObserver.observe' in s,
            'no document.write':'document.write(' not in s,
            'no runtime gzip':'DecompressionStream' not in s,
          }
          print(checks)
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('Verification failed: '+', '.join(bad))
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              f=Path(f'/tmp/shift-{i}.js')
              f.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'JS syntax failed in script {i}')
          print(f'JS syntax OK: {len(scripts)} scripts')
          PY

      - name: Commit and clean temporary files
        run: |
          rm -f .github/workflows/apply-v620.yml .github/v620_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade Team Network and loader v6.2'
          git push origin HEAD:main
