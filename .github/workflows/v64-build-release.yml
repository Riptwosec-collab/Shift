name: Build v6.4 Production Index

on:
  push:
    branches:
      - 'work/v6.4-legacy-ui-new-engine'
    paths:
      - '.github/workflows/v64-build-release.yml'

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --ignore-scripts
      - name: Build tracked production index
        run: npm run build
      - name: Full v6.4 verification
        run: npm test
      - name: Release and Cloudflare gates
        run: node --test tests/v64-release.test.mjs tests/build.test.mjs tests/cloudflare.test.mjs tests/legacy-visual-contract.test.mjs tests/v64-interactive.test.mjs
      - name: Commit generated production index
        run: |
          rm .github/workflows/v64-build-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/v64-build-release.yml
          git commit -m 'Ship generated Shift Command Center v6.4 index'
          git push origin HEAD:work/v6.4-legacy-ui-new-engine
